name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assemble --no-daemon

      - name: Run Unit Tests
        run: ./gradlew unitTest --no-daemon

      - name: Run Integration Tests
        run: ./gradlew integrationTest --no-daemon

      - name: Generate JaCoCo Coverage Report
        run: ./gradlew test jacocoTestReport -x jacocoTestCoverageVerification --no-daemon

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html/

  owasp-dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build to resolve dependencies
        run: ./gradlew assemble --no-daemon

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: /tmp/dependency-check-data
          key: ${{ runner.os }}-owasp-dc-data-v1
          restore-keys: |
            ${{ runner.os }}-owasp-dc-data-

      - name: Install OWASP Dependency-Check CLI
        run: |
          DC_VERSION="10.0.3"
          wget -q "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          unzip -q "dependency-check-${DC_VERSION}-release.zip"
          chmod +x dependency-check/bin/dependency-check.sh

      - name: Run OWASP Dependency-Check
        run: |
          mkdir -p reports
          ./dependency-check/bin/dependency-check.sh \
            --project "uc-spring-boot-upgrade-microservice-extraction" \
            --scan ./build/libs/ \
            --format HTML \
            --format JSON \
            --out reports/ \
            --data /tmp/dependency-check-data \
            --failOnCVSS 7 \
            --enableExperimental

      - name: Upload OWASP Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/
