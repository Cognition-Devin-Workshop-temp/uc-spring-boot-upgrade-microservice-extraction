name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble

      - name: Run Unit Tests
        run: ./gradlew unitTest

      - name: Run Integration Tests
        run: ./gradlew integrationTest

      - name: Generate JaCoCo Coverage Report
        if: always()
        run: ./gradlew jacocoTestReport -x test -x jacocoTestCoverageVerification

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/dependency-check-data
          key: owasp-db-${{ github.run_id }}
          restore-keys: |
            owasp-db-

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run OWASP Dependency-Check
        id: owasp-scan
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Evaluate OWASP results (fail on CVSS >= 7.0)
        if: steps.owasp-scan.outcome == 'failure'
        run: |
          if [ -f build/reports/dependency-check-report.json ]; then
            echo "OWASP report generated — checking for CVSS >= 7.0 violations"
            if grep -q '"severity" : "HIGH"\|"severity" : "CRITICAL"' build/reports/dependency-check-report.json; then
              echo "::error::Dependencies with CVSS >= 7.0 found. See OWASP report artifact."
              exit 1
            fi
            echo "No high/critical vulnerabilities found."
          else
            echo "::warning::OWASP scan could not complete (NVD data unavailable). Add NVD_API_KEY repo secret for full scanning: https://nvd.nist.gov/developers/request-an-api-key"
          fi

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: build/reports/dependency-check*
