[pytest]
# Pytest configuration for Playwright tests
# Migrated from: src/test/resources/selenium/testng.xml / testng-smoke.xml

testpaths = playwright_tests/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers (replaces TestNG groups)
markers =
    smoke: Smoke tests — quick sanity checks (replaces TestNG group "smoke")
    regression: Regression tests — full coverage (replaces TestNG group "regression")

# Default: generate JUnit XML + HTML report
addopts =
    --junitxml=playwright_tests/reports/junit-results.xml
    --html=playwright_tests/reports/report.html
    --self-contained-html
    -v
