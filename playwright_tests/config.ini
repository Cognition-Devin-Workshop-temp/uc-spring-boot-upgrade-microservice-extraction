# Playwright Test Configuration
# Migrated from: src/test/resources/selenium/config.properties

[application]
# Base URL of the application under test
# Frontend UI runs on port 3000, Backend API on port 8080
base_url = http://localhost:3000
api_url = http://localhost:8080

[browser]
# Browser: chromium, firefox, webkit
browser = chromium

# Run in headless mode
headless = false

# Slow down operations by specified milliseconds (useful for debugging)
slow_mo = 0

[timeouts]
# Default navigation timeout in milliseconds
navigation_timeout = 30000

# Default action timeout in milliseconds
action_timeout = 10000

# Expect (assertion) timeout in milliseconds
expect_timeout = 10000

[viewport]
# Browser viewport dimensions
width = 1280
height = 720

[screenshots]
# Capture screenshots: on, off, only-on-failure
screenshots = only-on-failure

# Screenshot directory (relative to project root)
screenshot_dir = playwright_tests/reports/screenshots

[tracing]
# Enable Playwright tracing: on, off, retain-on-failure
tracing = retain-on-failure

[reporting]
# Report directory (relative to project root)
report_dir = playwright_tests/reports
